# Trading Service 配置文件示例
# 复制此文件为 config.yaml 并根据实际情况修改

# ─────────────────────────────────────────────────────────────
# HTTP 服务器配置
# ─────────────────────────────────────────────────────────────
server:
  port: 8081        # 服务监听端口
  mode: release     # 运行模式: release(生产), debug(调试), test(测试)

# ─────────────────────────────────────────────────────────────
# CSV 存储配置
# ─────────────────────────────────────────────────────────────
storage:
  type: csv         # 存储类型 (目前仅支持 csv)
  data_dir: ./data  # CSV 文件存储目录

# ─────────────────────────────────────────────────────────────
# 默认交易参数
# ─────────────────────────────────────────────────────────────
defaults:
  leverage: 1              # 默认杠杆倍数
  slippage: 0.01           # 默认滑点容忍度 (1%)

  # 以下参数用于自动生成风控规则（新仓位自动生成止损/止盈规则）
  stop_loss_pct: -0.02           # 止损百分比 (负数，如 -0.02 表示 -2% 止损)
  profit_drawdown_pct: 0.05      # 回落止盈百分比 (正数，如 0.05 表示从最高点回落 5% 止盈)
  trailing_activation_pct: 0.05  # 回落止盈激活阈值 (正数，如 0.05 表示盈利 5% 后激活回落止盈)
  time_stop_hours: 72            # 时间止损小时数 (持仓超过此时间自动平仓，仅 API 注册 holding_time 时使用)

# ─────────────────────────────────────────────────────────────
# Webhook 通知配置
# ─────────────────────────────────────────────────────────────
notification:
  enabled: false              # 是否启用 webhook 通知
  open_url: ""                # 开仓通知 webhook URL (例如企业微信机器人)
  close_url: ""               # 平仓通知 webhook URL (风控平仓)
  test_url: ""                # 测试信号通知 webhook URL

# ─────────────────────────────────────────────────────────────
# 运行时配置
# ─────────────────────────────────────────────────────────────
runtime:
  price_snapshot_interval: 10s  # 价格快照间隔 (PMS 聚合持仓、判断风控规则是否触发的频率)

# ─────────────────────────────────────────────────────────────
# 交易所配置
# ─────────────────────────────────────────────────────────────
exchange:
  binance_testnet: true         # 是否使用 Binance 测试网 (true=测试网, false=主网)
  hyperliquid_testnet: true     # 是否使用 Hyperliquid 测试网 (true=测试网, false=主网)
  deribit_testnet: true        # 是否使用 Deribit 测试网 (true=测试网, false=主网)

# ─────────────────────────────────────────────────────────────
# 同步间隔配置
# ─────────────────────────────────────────────────────────────

# 交易所交易规则同步间隔 (tick_size, step_size 等)
# 这些规则很少变化，默认 10 天同步一次即可
filter_sync_interval: 240h

# ─────────────────────────────────────────────────────────────
# Deribit 期权配置
# ─────────────────────────────────────────────────────────────

# Deribit 期权平仓差值阈值
# 当 bid-ask 差值超过此阈值时，不自动平仓，发送通知要求手动操作
# 默认值: 0.005 (绝对值)
# 示例: bid=0.003, ask=0.008, spread=0.005 → 刚好满足阈值
deribit:
  spread_threshold: 0.005

#同步deribit期权仓位到本系统
deribit_position_sync:
  enabled: false                    # 是否启用Deribit仓位同步
  interval: 10m                     # 同步间隔(默认10分钟)

# 用户订单持仓同步间隔 (UOS 从 CSV 读取 PMS 更新)
# 当 PMS 平仓 (设置 deleted=1) 后，UOS 需要同步此状态以正确执行 parts 限制
#
# 权衡考虑:
#   - 较小值 (如 2s): 更实时，但 CSV 读取频率更高
#   - 较大值 (如 10s): I/O 更少，但可能延迟检测已平仓位
#
# 推荐值: 5s (适合大多数场景)


position_sync_interval: 5s

# ─────────────────────────────────────────────────────────────
# 仓位报告服务配置 (exchange_position_reporter)
# ─────────────────────────────────────────────────────────────
reporter:
  api_url: "http://localhost:8080/api/v1/exchange/positions"  # PMS 仓位查询接口地址
